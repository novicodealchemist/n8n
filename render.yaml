
services:
  - type: web
    name: n8n
    env: docker
    plan: free
    autoDeploy: true
    buildCommand: ""
    startCommand: "n8n"
    envVars:
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        sync: false
      - key: N8N_BASIC_AUTH_PASSWORD
        sync: false
      - key: N8N_HOST
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: N8N_PORT
        value: "5678"
      - key: NODE_ENV
        value: "production"
